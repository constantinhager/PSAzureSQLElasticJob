<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B1B33"/>
    <stop offset="1" stop-color="#12294D"/>
  </linearGradient>
  <linearGradient id="db" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3FCBFF"/>
    <stop offset="1" stop-color="#0E7FC7"/>
  </linearGradient>
  <linearGradient id="dbtop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8FE8FF"/>
    <stop offset="1" stop-color="#3FCBFF"/>
  </linearGradient>
  <linearGradient id="dbsmall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#79DBFF"/>
    <stop offset="1" stop-color="#1C9AE0"/>
  </linearGradient>
  <linearGradient id="dbsmalltop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#B3EEFF"/>
    <stop offset="1" stop-color="#79DBFF"/>
  </linearGradient>
  <linearGradient id="ps" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#33DFCF"/>
    <stop offset="1" stop-color="#0E9E93"/>
  </linearGradient>
</defs>

<!-- background badge -->
<rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

<!-- fan-out connector lines: one job db dispatching to many target dbs -->
<circle cx="220" cy="155" r="7" fill="#EAF9FF" fill-opacity="0.9"/>
<line x1="220" y1="155" x2="130" y2="245" stroke="#EAF9FF" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
<line x1="220" y1="155" x2="250" y2="270" stroke="#EAF9FF" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
<line x1="220" y1="155" x2="365" y2="225" stroke="#EAF9FF" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>

<!-- main job database cylinder -->
<path d="M156,70 L156,155 A64,19 0 0 0 284,155 L284,70 Z" fill="url(#db)"/>
<ellipse cx="220" cy="112" rx="64" ry="19" fill="none" stroke="#0B1B33" stroke-opacity="0.3" stroke-width="3.5"/>
<ellipse cx="220" cy="70" rx="64" ry="19" fill="url(#dbtop)"/>

<!-- target database cylinders (fanned out) -->
<path d="M94,245 L94,287 A36,12 0 0 0 166,287 L166,245 Z" fill="url(#dbsmall)"/>
<ellipse cx="130" cy="245" rx="36" ry="12" fill="url(#dbsmalltop)"/>

<path d="M214,270 L214,312 A36,12 0 0 0 286,312 L286,270 Z" fill="url(#dbsmall)"/>
<ellipse cx="250" cy="270" rx="36" ry="12" fill="url(#dbsmalltop)"/>

<path d="M329,225 L329,267 A36,12 0 0 0 401,267 L401,225 Z" fill="url(#dbsmall)"/>
<ellipse cx="365" cy="225" rx="36" ry="12" fill="url(#dbsmalltop)"/>

<!-- PowerShell chevron badge, bottom-right, black glyph -->
<circle cx="392" cy="392" r="76" fill="url(#ps)" stroke="#0B1B33" stroke-width="10"/>
<path d="M366,366 L400,392 L366,418" fill="none" stroke="#0A0A0A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="406" y1="418" x2="434" y2="418" stroke="#0A0A0A" stroke-width="14" stroke-linecap="round"/>

</svg>
